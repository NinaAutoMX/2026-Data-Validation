<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Validation Report</title>
<link rel="icon" type="image/png" href="https://copilot.microsoft.com/th/id/BCO.5f34131a-d4f6-472e-94d0-cdd1c38d89f0.png">
<style>
  :root {
    --bg-primary:#fff; --bg-secondary:#f8f9fa; --bg-section:rgba(255,255,255,.95);
    --text-primary:#1a1a1a; --text-secondary:#4e125f; --border-color:#e0e0e0;
    --shadow:rgba(0,0,0,.1); --accent:#6a1a7f; --accent-hover:#4e125f;
    --input-bg:rgba(255,255,255,.9); --success:#27ae60; --warning:#e67e22; --danger:#c0392b;
  }
  [data-theme="dark"] {
    --bg-primary:#1a1a1a; --bg-secondary:#2c2c2c; --bg-section:rgba(40,40,40,.95);
    --text-primary:#e0e0e0; --text-secondary:#b896d4; --border-color:#404040;
    --shadow:rgba(0,0,0,.3); --accent:#8e5ea2; --accent-hover:#b896d4; --input-bg:rgba(50,50,50,.9);
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  body { font-family:'Segoe UI',-apple-system,BlinkMacSystemFont,Roboto,Arial,sans-serif; color:var(--text-primary);
    background:linear-gradient(135deg,#8b5cf6 0%,#6366f1 50%,#7c3aed 100%); min-height:100vh; padding:20px; transition:all .3s; }
  .container { max-width:1400px; margin:0 auto; background:var(--bg-primary); border-radius:16px; box-shadow:0 20px 60px var(--shadow); overflow:hidden; }
  .header { background:linear-gradient(135deg,var(--accent),var(--accent-hover)); padding:30px 40px; display:flex;
    justify-content:space-between; align-items:center; color:#fff; gap:14px; flex-wrap:wrap; }
  .header-content { display:flex; align-items:center; gap:30px; flex:1; }
  .header h1 { font-size:2em; font-weight:600; white-space:nowrap; }
  .autobody-input-wrapper { flex:1; max-width:400px; }
  .autobody-input-wrapper label { display:block; font-size:.85em; margin-bottom:8px; opacity:.9; color:#fff; }
  .autobody-input-wrapper input { width:100%; padding:10px 15px; border:2px solid rgba(255,255,255,.3); border-radius:8px;
    background:rgba(255,255,255,.15); color:#fff; font-size:1em; }
  .autobody-input-wrapper input::placeholder { color:rgba(255,255,255,.6); }
  .autobody-input-wrapper input:focus { outline:none; background:rgba(255,255,255,.25); border-color:rgba(255,255,255,.6); }
  .header-buttons { display:flex; gap:10px; flex-wrap:wrap; }
  .theme-toggle { background:rgba(255,255,255,.2); border:2px solid rgba(255,255,255,.3); border-radius:50px; padding:8px 16px;
    display:flex; align-items:center; gap:8px; color:#fff; font-size:.9em; box-shadow:none; }
  .theme-toggle:hover { background:rgba(255,255,255,.3); }
  #motivationBox { display:none; margin:20px 40px; padding:25px; border-left:5px solid #ffa500; border-radius:12px;
    background:linear-gradient(135deg,rgba(255,215,0,.2),rgba(255,140,0,.2)); }
  #motivationText { font-size:1.1em; font-style:italic; }
  .content { padding:40px; }
  .section { background:var(--bg-section); padding:30px; border-radius:12px; margin-bottom:30px; border:1px solid var(--border-color);
    box-shadow:0 2px 8px var(--shadow); }
  .section-title { font-size:1.3em; font-weight:600; color:var(--text-secondary); margin-bottom:25px; padding-bottom:15px;
    border-bottom:2px solid var(--accent); display:flex; align-items:center; gap:10px; }
  .section-title::before { content:"●"; color:var(--accent); }
  .input-grid { display:grid; gap:20px; }
  .input-group { display:grid; grid-template-columns:200px 1fr; gap:15px; align-items:center; }
  .input-pair { display:grid; grid-template-columns:200px 1fr 200px 1fr; gap:15px; align-items:center; }
  label { font-weight:500; font-size:.95em; }
  input[type=number], input[type=text], input[type=date], textarea, select {
    padding:12px 16px; font-size:14px; border:2px solid var(--border-color); border-radius:8px;
    background:var(--input-bg); color:var(--text-primary); font-family:inherit; transition:all .3s; }
  select { width:100%; cursor:pointer; }
  input:hover, textarea:hover, select:hover, fieldset:hover { border-color:var(--accent); }
  input:focus, textarea:focus, select:focus { outline:none; border-color:var(--accent); box-shadow:0 0 0 3px rgba(106,26,127,.1); }
  textarea { min-height:100px; resize:vertical; }
  .checkbox-group { display:flex; flex-wrap:wrap; gap:12px 22px; align-items:center; }
  .checkbox-group label { display:flex; align-items:center; cursor:pointer; user-select:none; }
  input[type=checkbox], input[type=radio] { margin-right:8px; width:18px; height:18px; cursor:pointer; accent-color:var(--accent); }
  .sub-toggle { display:none; gap:16px; align-items:center; margin-top:14px; padding:8px 14px; flex-wrap:wrap;
    background:var(--bg-secondary); border:1px solid var(--border-color); border-radius:8px; }
  .sub-toggle label { font-weight:400; }
  .disclaimer-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(300px,1fr)); gap:20px; }
  fieldset { border:2px solid var(--border-color); border-radius:10px; padding:16px 20px; background:var(--bg-secondary); transition:all .3s; }
  legend { font-weight:600; color:var(--accent); padding:0 10px; font-size:.95em; }
  .button-container { display:flex; gap:20px; justify-content:center; margin:30px 0 10px; flex-wrap:wrap; }
  button { background:linear-gradient(135deg,var(--accent),var(--accent-hover)); color:#fff; border:none; border-radius:10px;
    padding:14px 32px; font-size:1em; font-weight:600; cursor:pointer; transition:all .3s; box-shadow:0 4px 12px var(--shadow); }
  button:hover { transform:translateY(-2px); box-shadow:0 6px 20px var(--shadow); }
  .new-report-btn { background:linear-gradient(135deg,#2c3e50,#34495e); }
  .autosave-indicator { text-align:center; color:var(--accent); font-size:.9em; font-style:italic; padding:15px;
    background:var(--bg-section); border-radius:8px; margin-top:10px; border:1px solid var(--border-color); }
  #output { background:var(--bg-section); border:2px solid var(--accent); border-left:6px solid var(--accent); padding:30px;
    margin-top:30px; border-radius:12px; box-shadow:0 4px 16px var(--shadow); }
  #reportText { word-break:break-word; font-family:Calibri,'Segoe UI',sans-serif; font-size:11pt; line-height:1.6; }
  #reportText p, #reportText .block { margin-bottom:16px; }
  .fade-in { animation:fadeIn .5s ease-in; }
  @keyframes fadeIn { from { opacity:0; transform:translateY(20px); } to { opacity:1; transform:none; } }
  @media (max-width:768px) {
    .header, .header-content { flex-direction:column; width:100%; }
    .autobody-input-wrapper { max-width:100%; }
    .input-pair, .input-group { grid-template-columns:1fr; }
    .content, .section { padding:20px; }
    .button-container { flex-direction:column; }
    button { width:100%; }
  }
</style>
</head>
<body>
<div class="container fade-in">
  <div class="header">
    <div class="header-content">
      <h1>Validation Report</h1>
      <div class="autobody-input-wrapper">
        <label for="autobodyName">Autobody Name</label>
        <input type="text" id="autobodyName" placeholder="Enter autobody name...">
      </div>
    </div>
    <div class="header-buttons">
      <button class="theme-toggle" onclick="toggleTheme()"><span id="themeIcon">🌙</span><span id="themeText">Dark Mode</span></button>
      <button class="theme-toggle" onclick="getMotivation()"><span>💪</span><span>I need Motivation</span></button>
    </div>
  </div>

  <div id="motivationBox">
    <p id="motivationText"></p>
    <button style="margin-top:15px;padding:8px 20px;font-size:.9em" onclick="$('motivationBox').style.display='none'">Close</button>
  </div>

  <div class="content">
    <div id="form"></div>
    <div class="button-container">
      <button onclick="generateReport()">Generate Report</button>
      <button class="new-report-btn" onclick="newReport()">Generate New Report</button>
    </div>
    <div class="button-container"><button onclick="generateEmail()">Generate Email</button></div>
    <div class="autosave-indicator" id="autosaveIndicator"></div>
    <div id="output"><div id="reportText"></div></div>
  </div>
</div>

<script>
/* =====================================================================
   1. CONFIGURATION  (edit these lists to add/remove options)
   ===================================================================== */
const SYSTEMS = ['TMS','Dr Smash','Vantage','Veculim','Easy Costings','Plan Manager','AIS','MultiCat','QSA','Workshop Boss','Auto Soft','PanelDesk'];

// [id, checkbox label, name used in emails (defaults to label)]
const APPROVALS = [
  ['baic','BAIC'], ['byd','BYD'], ['chery','Chery','Chery, Omoda & Jaecoo'], ['ford','Ford'], ['gwm','GWM/Haval'],
  ['honda','Honda'], ['hyundai','Hyundai'], ['icaur','ICaur'], ['isuzu','Isuzu'], ['jac','JAC'], ['jetour','Jetour'],
  ['leapmotor','Leapmotor'], ['ldv','LDV'], ['mahindra','Mahindra'], ['mg','MG'], ['mitsubishi','Mitsubishi'], ['nissan','Nissan'],
  ['renault','Renault'], ['stellantis','Stellantis'], ['subaru','Subaru'], ['suzuki','Suzuki'], ['tata','Tata'],
  ['volvo','Volvo'], ['bmw','BMW'],
];
const STELLANTIS_BRANDS = {
  Premium:  'Alfa Romeo, Abarth, Chevrolet, Chrysler, Citroen, Dodge, Fiat, Jeep, Opel & Peugeot',
  Standard: 'Chevrolet, Chrysler, Citroen, Dodge, Fiat, Opel & Peugeot',
};

// Radio groups that only appear when their trigger checkbox is ticked
const SUB_TOGGLES = [
  { id:'stellantis', trigger:'ap-stellantis',    name:'stellantisType',      title:'Stellantis type:', options:['Premium', 'Standard'] },
  { id:'mg',         trigger:'ap-mg',            name:'mgType',              title:'MG type:',         options:['Standard', 'EV'] },
  { id:'aggregate',  trigger:'chkAggregateMake', name:'aggregateMakeOption', title:'Aggregate data:',  options:['Including', 'Excluding'] },
];

// [id, brand name, form date, special (excluded from the generic "in warranty" email paragraph)]
const DISCLAIMERS = [
  ['baic','BAIC'], ['byd','BYD','27/11/2025'], ['ford','Ford','08/11/2024'], ['gwm','GWM & Haval','19/08/2025'],
  ['honda','Honda','17/01/2025'], ['hyundai','Hyundai','01/04/2025'], ['icaur','ICaur'], ['isuzu','Isuzu','21/05/2025'],
  ['jac','JAC','27/06/2025'], ['jetour','Jetour'], ['ldv','LDV','19/11/2025'], ['mahindra','Mahindra','22/07/2025'],
  ['mg','MG','26/11/2025'], ['mitsubishi','Mitsubishi','28/03/2025'], ['renault','Renault','02/12/2025'],
  ['subaru','Subaru','04/02/2026'], ['suzuki','Suzuki','09/06/2025'], ['tata','Tata','02/03/2026'],
  ['volvo','Volvo','05/06/2025'],
  ['stellantis','Stellantis Categorization Forms','18/11/2024',true],
  ['volvov','Volvo Warranty & Maintenance Verification','02/04/2025',true],
];
const OUT_OF_WARRANTY_BRANDS = ['Ford','Honda'];   // safety-critical-parts disclaimer paragraph

// Invalid-model groups. Each ticked model contributes its label/variants, so the email only
// mentions the models that were actually ticked. `text` receives { names, variants }.
const plural = (names, one, many) => names.length > 1 ? many : one;
const MODEL_GROUPS = [
  { items: [{ model:'Chery Jaecoo', label:'Jaecoo' }, { model:'Chery Lepas', label:'Lepas' }, { model:'Chery Omoda', label:'Omoda' }],
    text: ({ names }) => `Kindly note in particular that while ${joinList(names, 'and')} ${plural(names, 'forms part', 'form parts')} of your approval with Chery ${plural(names, 'it is considered a separate brand', 'they are considered separate brands')} to Chery. Please capture the correct brand as the make and the correct model as the model. Please see attached the relevant Chery Bulletin.` },
  { items: [{ model:'LDV T60', label:'T60' }],
    text: () => 'Kindly note further LDV does not accept "T60" as a valid model as they have multiple T60 models (i.e. T60 Elite, T60 Max Luxe, T60 Max Pro & T60 Pro). Please ensure that the ending variant is included when capturing the LDV T60 models.' },
  { items: [{ model:'Chery Tiggo', label:'Tiggo' }],
    text: () => 'Kindly note further Chery does not accept "Tiggo" as a valid model without the number variant as they have multiple Tiggo models. Please ensure that the number variant is included when capturing the Tiggo models. Please find attached the relevant Chery Bulletin.' },
  { items: [{ model:'GWM Haval', label:'Haval' }],
    text: () => 'Kindly note while Haval forms part of your approval with GWM, it is considered a separate brand to GWM. Please capture the Make as "Haval" and the model as the model (e.g. H6).' },
  { items: [{ model:'GWM Steed', label:'Steed', variants:'Steed 5, Steed 6' }, { model:'GWM Ora', label:'Ora', variants:'Ora 03, Ora5' }, { model:'GWM Tank', label:'Tank', variants:'Tank 300 & Tank 500' }],
    nameOrder: ['Ora', 'Steed', 'Tank'],
    text: ({ names, variants }) => `Kindly note further GWM has multiple ${joinList(names, 'and')} models (${variants}). Please ensure that the number variant is included when capturing the GWM ${joinList(names, 'and')} models.` },
  { items: [{ model:'Mahindra Scorpio', label:'Scorpio', variants:'Scorpio-N, Scorpio SUV10, Scorpio SUV S11' }, { model:'Mahindra XUV', label:'XUV', variants:'XUV3XO, XUV200, XUV300, XUV500 & XUV700' }],
    text: ({ names, variants }) => `Kindly note further that Mahindra has multiple ${joinList(names, 'and')} models (i.e. ${variants}). Please ensure that the models are fully and accurately captured on your management system and submitted to AutoMX Connect.` },
];
const MODELS = MODEL_GROUPS.flatMap(g => g.items.map(i => i.model));

function modelNotes(selected) {
  return MODEL_GROUPS.flatMap(g => {
    const picked = g.items.filter(i => selected.includes(i.model));
    if (!picked.length) return [];
    const names = (g.nameOrder || g.items.map(i => i.label)).filter(l => picked.some(i => i.label === l));
    return [g.text({ names, variants: picked.map(i => i.variants).filter(Boolean).join(', ') })];
  });
}

// Repair totals: each row is one or two [id, label, placeholder] fields
const TOTALS_ROWS = [
  [['activeRepairs','Active Repairs:'], ['approvedActive','Approved Brand – Active:']],
  [['completed2026','Completed Repairs 2026:'], ['approved2026','Approved Brand – 2026:']],
  [['completed2025','Completed Repairs 2025:'], ['approved2025','Approved Brand – 2025:']],
  [['exclusive2025','2025 Repairs (Excl. Earlier):'], ['completed2024','Completed Repairs 2024:']],
  [['completed2023','Completed Repairs 2023:'], ['completed2022','Completed Repairs 2022:']],
  [['writeOffs','Write-offs (total):'], ['writeOffsUnder40k','Write-offs &lt; R40 000:']],
  [['pp2026','PP 2026:'], ['pp2025','PP 2025:']],
  [['tsp2026','2026 TSP:'], ['tsp2025','2025 TSP:']],
  [['invalidJobs','Invalid Jobs:'], ['extndDelay','Extended Delays:']],
  [['openLong','Open &gt;100 Days:','e.g. 186'], ['openLongApproved','Approved Brand – Open &gt;100 Days:','e.g. 20']],
];
const MISSING_ROWS = [
  [['missstart','Missing Start Date:']], [['compldatemiss','Missing Compl. Date:']], [['make','Missing Make:']],
  [['validModel','Missing Valid Model:']],            // model checkboxes are inserted after this row
  [['hasRegno','Missing Registration No:']], [['missingVIN','Missing VIN:']],
  [['missReg','Missing Year of Registration:'], ['missRegActive','Active:']],
  [['missRegUnknownWarranty','Unknown Warranty Status:']],
  [['mileage','Missing Mileage:'], ['mileageActive','Active:']],
  [['ownerName','Missing Owner Name:']], [['ownerTel','Missing Owner Tel:']],
  [['fullQuote','Missing Full Quote Details:']], [['partDescription','Missing Part Description:']],
  [['missingSupplier','Missing Supplier Name:']],
  [['spotSample','Spot-checked repairs:'], ['flaggedParts','Flagged:']],
  [['ppp','Missing Part Purchase Price:'], ['appp','Missing PPP for Approved:']],
  [['ppSpotCheckFlagged','Flagged repairs from PP spot-check:']],
];

const QUOTES = [
  "Those missing fields don't stand a chance against your determination! ⚡",
  "Coffee + Validation Reports = Unstoppable You! ☕✨",
  "Those part descriptions aren't going to validate themselves - but YOU can! 💼",
  "Crying but trying is still trying. You got this boo! 🫡",
  "Validation errors are just spicy encouragement. 🌶️",
  "Every missing field is just character development. 📑✨",
  "Every unsubmitted repair is just playing hard to get. 💅",
  "Your management system isn't glitching, it's just having feelings. 🤖💔",
  "OEMs aren't mad, they're just disappointed... but YOU'RE fixing it! 🛠️✨",
  "Part purchase prices are just numbers with commitment issues. 💰💍",
  "Every disclaimer form is a love letter to compliance! 💌",
  "Missing supplier names? More like surprise suppliers! 🎁",
  "Stellantis categorization forms are just personality tests for cars! 🚙📋",
  "Chery Tiggo without numbers? That's just a Tiggo in witness protection! 🕵️",
  "Success is 10% inspiration, 90% pretending you understood the email. 📧",
  "Behind every great worker is a browser with 47 tabs 👀",
  "Critical but stable, you've got this. Hopefully 😬",
  "Friday energy on Monday should be illegal. 📅⚖️",
];

/* =====================================================================
   2. SMALL HELPERS
   ===================================================================== */
const $ = id => document.getElementById(id);
const slug = s => s.toLowerCase().replace(/[^a-z0-9]+/g, '-');
const num = id => +$(id)?.value || 0;
const text = id => $(id)?.value.trim() || '';
const checked = id => !!$(id)?.checked;
const radio = name => document.querySelector(`input[name="${name}"]:checked`)?.value || '';
const joinList = (arr, word = '&') => arr.length > 1 ? `${arr.slice(0, -1).join(', ')} ${word} ${arr.at(-1)}` : arr.join('');
const fmtDate = iso => new Date(iso).toLocaleDateString('en-ZA');
const fmtMoney = v => 'R ' + v.toLocaleString('fr-FR', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const red = s => `<span style="color:var(--danger);font-weight:bold;">${s}</span>`;
const over5 = (v, total) => v > 0 && (!total || v / total >= 0.05);       // 5% threshold
const flag = (v, total, label) => { const s = `${v}/${total} ${label}`; return over5(v, total) ? red(s) : s; };

function numbers() {            // every numeric input as {id: number}
  const d = {};
  document.querySelectorAll('input[type=number]').forEach(el => d[el.id] = +el.value || 0);
  return d;
}
function totals(d) {
  const completedTotal = d.approved2026 + d.approved2025;
  return {
    completedTotal,
    repairTotal: completedTotal + d.approvedActive,
    allTotal: d.completed2026 + d.exclusive2025 + d.activeRepairs,
  };
}
const managementSystems = () => SYSTEMS.filter(s => checked('sys-' + slug(s)));
function managementSystemText() {
  const list = [...managementSystems(), text('otherMan')].filter(Boolean);
  return list.length ? list.join(' or ') : 'MANAGEMENT SYSTEM';
}
const disclaimerStatus = id => $('disc-' + id)?.value || '';
const selectedModels = () => [...document.querySelectorAll('input[name="validModels"]:checked')].map(c => c.value);

/* =====================================================================
   3. FORM BUILDING
   ===================================================================== */
const checkbox = (id, label, extra = '') => `<label><input type="checkbox" id="${id}" ${extra}> ${label}</label>`;
const numField = ([id, label, ph = '']) => `<label for="${id}">${label}</label><input type="number" id="${id}" placeholder="${ph}">`;
const row = fields => fields.length === 2
  ? `<div class="input-pair">${fields.map(numField).join('')}</div>`
  : `<div class="input-group">${numField(fields[0])}</div>`;
const section = (title, body) => `<div class="section"><h3 class="section-title">${title}</h3>${body}</div>`;
const textRow = (id, label, ph) => `<div class="input-group"><label for="${id}">${label}</label><input type="text" id="${id}" placeholder="${ph}"></div>`;
const statusSelect = ([id, brand, date]) => `
  <fieldset><legend>${brand} ${date || ''}</legend>
    <select id="disc-${id}" class="disclaimer-select">
      <option value="">Select status...</option>
      <option value="not-submitting">Not submitting</option>
      <option value="submitting">Submitting</option>
      <option value="partial">Partial submission</option>
    </select></fieldset>`;

const subToggle = id => {
  const t = SUB_TOGGLES.find(x => x.id === id);
  return `<div id="sub-${t.id}" class="sub-toggle"><span style="font-weight:600;color:var(--accent)">${t.title}</span>
    ${t.options.map(o => `<label><input type="radio" name="${t.name}" value="${o}"> ${o}</label>`).join('')}</div>`;
};

function buildForm() {
  $('form').innerHTML = [
    section('Management System', `<div class="input-grid">
      <div class="checkbox-group">${SYSTEMS.map(s => checkbox('sys-' + slug(s), s)).join('')}</div>
      ${textRow('otherMan', 'Other:', 'Other Management System used')}</div>`),

    section('Approvals', `
      <div class="checkbox-group">${APPROVALS.map(([id, label]) => checkbox('ap-' + id, label)).join('')}</div>
      ${subToggle('stellantis')}${subToggle('mg')}`),

    section('Repair Totals', `<div class="input-grid">
      <div class="checkbox-group">
        ${checkbox('chkLastSubmitted', 'Data last submitted:')}
        <input type="date" id="lastSubmittedDate">
        ${checkbox('chkHasAccess', 'Does not have website access')}
      </div>${TOTALS_ROWS.map(row).join('')}</div>`),

    section('Aggregate Data Submission', `<div class="input-grid">
      <div class="checkbox-group">
        ${checkbox('chkAggregateMake', 'Submitting aggregate data')}
        ${checkbox('chkFullData', 'Submitting full data for all brands')}
        ${checkbox('chkFullBrandData', 'Submitting full data for approved brands')}
        ${checkbox('chkInsurerName', 'Not submitting Insurer Name')}
      </div>
      ${subToggle('aggregate')}
      <div class="input-group">${checkbox('chkAggregateText', 'Receiving aggregate data for some repairs')}
        <input type="text" id="aggregateTextBrands" placeholder="e.g. Ford, Hyundai, Mahindra"></div>
      <div class="input-group">${checkbox('chkNotReceiving', 'Not submitting full data for:')}
        <input type="text" id="receivingNotBrands" placeholder="e.g. Ford, Hyundai, Mahindra"></div></div>`),

    section('Missing Field Summary', `<div class="input-grid">
      ${MISSING_ROWS.map(r => row(r) + (r[0][0] === 'validModel'
        ? `<div class="checkbox-group">${MODELS.map(m => checkbox('model-' + slug(m), m, `name="validModels" value="${m}"`)).join('')}</div>` : '')).join('')}
      <div class="input-group"><label for="pp2026JobsInput">PP 2026 Job Details:</label>
        <textarea id="pp2026JobsInput" placeholder="e.g. 12345 - Ford - 01/01/2026, 12346 - Hyundai - 02/01/2026"></textarea></div></div>`),

    section('Disclaimer Forms', `<div class="disclaimer-grid">${DISCLAIMERS.map(statusSelect).join('')}</div>`),

    section('Final Notes', `<div class="input-grid">
      <div class="input-group"><label for="additionalNotes">Additional Notes:</label>
        <textarea id="additionalNotes" placeholder="Any extra context or observations..."></textarea></div>
      <div class="checkbox-group"><label>Created By:</label>
        ${['NH', 'JW', 'AA'].map(c => checkbox('creator-' + c, `(${c})`, `name="creator" value="${c}"`)).join('')}</div></div>`),
  ].join('');
}

const syncSubToggles = () => SUB_TOGGLES.forEach(t => {
  const on = checked(t.trigger);
  $('sub-' + t.id).style.display = on ? 'flex' : 'none';
  if (!on) document.querySelectorAll(`input[name="${t.name}"]`).forEach(r => r.checked = false);
});

/* =====================================================================
   4. THEME, AUTO-SAVE, NEW REPORT, MOTIVATION
   ===================================================================== */
function applyTheme(theme) {
  document.documentElement.setAttribute('data-theme', theme);
  $('themeIcon').textContent = theme === 'dark' ? '☀️' : '🌙';
  $('themeText').textContent = theme === 'dark' ? 'Light Mode' : 'Dark Mode';
}
function toggleTheme() {
  const theme = document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
  localStorage.setItem('theme', theme);
  applyTheme(theme);
}

const SAVE_KEY = 'repairDashboardData';
const IDLE_MSG = 'Auto-save enabled - Your work is saved automatically';
const formFields = () => document.querySelectorAll('#autobodyName, #form input, #form select, #form textarea');

function showStatus(msg, color) {
  const el = $('autosaveIndicator');
  el.textContent = msg; el.style.color = color;
  setTimeout(() => { el.textContent = IDLE_MSG; el.style.color = 'var(--accent)'; }, 2000);
}
function saveFormData() {
  const data = {};
  formFields().forEach(el => {
    if (el.type === 'radio') { if (el.checked) data['radio:' + el.name] = el.value; }
    else if (el.type === 'checkbox') data[el.id] = el.checked;
    else data[el.id] = el.value;
  });
  localStorage.setItem(SAVE_KEY, JSON.stringify(data));
  showStatus('Auto-saved ✓', 'var(--success)');
}
function loadFormData() {
  let data;
  try { data = JSON.parse(localStorage.getItem(SAVE_KEY)); } catch { data = null; }
  if (!data) return;
  formFields().forEach(el => {
    if (el.type === 'radio') el.checked = data['radio:' + el.name] === el.value;
    else if (el.type === 'checkbox') el.checked = !!data[el.id];
    else if (data[el.id] !== undefined) el.value = data[el.id];
  });
}
let saveTimer;
const autoSave = () => { clearTimeout(saveTimer); saveTimer = setTimeout(saveFormData, 1000); };

function newReport() {
  if (!confirm('Are you sure you want to start a new report? This will clear all current data.')) return;
  localStorage.removeItem(SAVE_KEY);
  formFields().forEach(el => {
    if (el.type === 'checkbox' || el.type === 'radio') el.checked = false;
    else if (el.tagName === 'SELECT') el.selectedIndex = 0;
    else el.value = '';
  });
  $('reportText').innerHTML = '';
  syncSubToggles();
  showStatus('New report started', 'var(--warning)');
}

function getMotivation() {
  $('motivationText').textContent = QUOTES[Math.floor(Math.random() * QUOTES.length)];
  $('motivationBox').style.display = 'block';
  $('motivationBox').scrollIntoView({ behavior: 'smooth', block: 'nearest' });
}

/* =====================================================================
   5. DISCLAIMER HELPERS
   ===================================================================== */
// Brands (from DISCLAIMERS) whose status is in `statuses`; optionally skip the "special" forms
function disclaimerBrands(statuses, { includeSpecial = true } = {}) {
  return DISCLAIMERS
    .filter(([id, , , special]) => (includeSpecial || !special) && statuses.includes(disclaimerStatus(id)))
    .map(([, brand]) => brand);
}
const NOT_SUBMITTED = ['not-submitting', 'partial'];

/* =====================================================================
   6. GENERATE REPORT  (internal note)
   ===================================================================== */
function generateReport() {
  const d = numbers(), { completedTotal, repairTotal, allTotal } = totals(d);
  const parts = [];
  const prefix = text('autobodyName') ? `${text('autobodyName')} - ` : '';
  const submitted = checked('chkLastSubmitted') && $('lastSubmittedDate').value
    ? ` - Data last submitted ${fmtDate($('lastSubmittedDate').value)}` : '';

  // Headline summary
  parts.push(
    `${prefix}${new Date().toLocaleDateString('en-ZA')}${submitted} - Active (${d.activeRepairs}); ` +
    `Completed 2022(${d.completed2022}), 2023(${d.completed2023}), 2024(${d.completed2024}), 2025(${d.completed2025}), 2026(${d.completed2026}); ` +
    `Write-offs(${d.writeOffs}). Extended Delayed Repairs(${d.extndDelay}). ` +
    `PP 2025(${d.pp2025}/${d.completed2025}) & PP 2026(${d.pp2026}/${d.completed2026}); ` +
    `2025 TSP(${fmtMoney(d.tsp2025)}) & 2026 TSP(${fmtMoney(d.tsp2026)}). Invalid Jobs(${d.invalidJobs}).`);

  if (d.openLong) parts.push(`There are ${d.openLong}/${d.activeRepairs} Active repairs that have been open for more than 100 days (${d.openLongApproved}/${d.openLong} are for approved brands).`);

  // Aggregate data
  const makeOption = radio('aggregateMakeOption');
  if (checked('chkAggregateMake')) parts.push(`They are submitting aggregate data${makeOption ? ` (${makeOption})` : ''} Make.`);
  const exceptText = checked('chkNotReceiving') && text('receivingNotBrands') ? `Except (${text('receivingNotBrands')}).` : '';
  if (checked('chkFullBrandData')) { parts.push('They are submitting full data for all brands they hold approval with.'); if (exceptText) parts.push(exceptText); }
  if (checked('chkFullData')) parts.push('They are submitting full data for all brands.');
  if (exceptText && !checked('chkFullBrandData')) parts.push(exceptText);
  if (checked('chkAggregateText') && text('aggregateTextBrands')) parts.push(`There are some (${text('aggregateTextBrands')}) repairs where we are receiving aggregate data.`);
  if (checked('chkInsurerName')) parts.push('They are not submitting Insurer name.');
  if (d.writeOffsUnder40k) parts.push(`There are ${d.writeOffsUnder40k}/${d.writeOffs} write-offs with repair values under R 40 000.00.`);

  // Missing fields
  const issues = [];
  const add = (v, total, label) => v && issues.push(flag(v, total, label));
  // Critical fields: reported as plain counts, not out of a total
  if (d.missstart) issues.push(`${d.missstart} repairs are missing start date`);
  if (d.compldatemiss) issues.push(`${d.compldatemiss} repairs are missing completion date`);
  if (d.make) issues.push(`${d.make} repairs are missing make`);
  if (d.validModel) {
    const models = selectedModels();
    issues.push(flag(d.validModel, repairTotal, 'have invalid model') + (models.length ? ` (including ${joinList(models)})` : ''));
  }
  add(d.hasRegno, repairTotal, 'missing registration no');
  add(d.missingVIN, repairTotal, 'missing VIN');
  if (d.missReg) {
    const entry = `${d.missReg}/${repairTotal} missing year of reg (${d.missRegActive}/${d.approvedActive} are active, ${d.missRegUnknownWarranty}/${repairTotal} have unknown warranty status)`;
    issues.push(over5(d.missRegUnknownWarranty, repairTotal) ? red(entry) : entry);   // red only on the unknown-warranty 5% threshold
  }
  if (d.mileage) issues.push(`${flag(d.mileage, repairTotal, 'missing mileage')} (${d.mileageActive}/${d.approvedActive} are active)`);
  add(d.ownerName, repairTotal, 'missing owner name');
  add(d.ownerTel, repairTotal, 'missing owner telephone');
  add(d.fullQuote, repairTotal, 'missing full quote details');
  if (issues.length) parts.push(issues.join('; ') + '.');

  // Parts: description, supplier (with spot-check), purchase price
  if (d.partDescription) parts.push(flag(d.partDescription, completedTotal, 'completed repairs missing part description') + '.');

  if (d.missingSupplier) {
    parts.push(`${d.missingSupplier}/${completedTotal} completed repairs on approved brands are flagged missing Supplier Name.`);
    if (d.spotSample > 0) {
      const estimate = Math.min(Math.round(d.missingSupplier * d.flaggedParts / d.spotSample), d.missingSupplier);
      const likely = `${estimate}/${completedTotal} completed repairs on approved brands are missing Supplier Name for Parts`;
      parts.push(`I spot-checked ${d.spotSample} (${d.flaggedParts}/${d.spotSample} flagged), therefore it is likely that ` +
        `${over5(estimate, completedTotal) ? red(likely) : likely}.`);
    }
  }

  if (d.ppp) parts.push(`${flag(d.ppp, allTotal, 'completed repairs are flagged for missing part purchase price')} (${d.appp}/${repairTotal} are for approved brands).`);

  const ppJobs = text('pp2026JobsInput').split(/[,\n]/).map(s => s.trim()).filter(Boolean);
  if (ppJobs.length) {
    parts.push(`I spot-checked 10 High Value repairs with R0.00 and found ${d.ppSpotCheckFlagged} repairs where we are receiving Part Description/Job Card Price and/or Part Number. Jobs affected: ${ppJobs.join(', ')}.`);
  }

  // Disclaimer forms (regular brands vs. the two special forms)
  const SPECIAL = DISCLAIMERS.filter(x => x[3]).map(x => x[1]);
  const group = status => {
    const all = disclaimerBrands([status]);
    return { regular: all.filter(b => !SPECIAL.includes(b)), special: all.filter(b => SPECIAL.includes(b)) };
  };
  const sub = group('submitting'), not = group('not-submitting'), par = group('partial');
  const sentences = [];
  if (sub.regular.length) sentences.push(`They have submitted Disclaimer forms for ${joinList(sub.regular)}`);
  if (not.regular.length) sentences.push(`They have not submitted any Disclaimer forms for ${joinList(not.regular)}`);
  if (par.regular.length) sentences.push(`They have submitted Disclaimer forms for ${joinList(par.regular)}, however there appears to be repairs that do not have Disclaimer forms`);
  if (sub.special.length) sentences.push(`They have submitted ${joinList(sub.special)}`);
  if (not.special.length) sentences.push(`They have not submitted ${joinList(not.special)}`);
  if (par.special.length) sentences.push(`They have submitted ${joinList(par.special)}, however there appears to be repairs that do not have the required forms`);
  if (sentences.length) parts.push(sentences.join('. ') + '.');

  // Actions taken (mirrors what the email asks for)
  parts.push('I sent them their 2025 & 2026 validation reports requesting they correct their data.');
  if (selectedOEMs().length && text('pp2026JobsInput')) parts.push('I also noted that there are a number of repairs where we are not receiving the required parts information and requested they ensure that the required parts information is captured on their management system and submitted to AutoMX Connect.');
  if (checked('chkNotReceiving') && text('receivingNotBrands')) parts.push(`I noted we are not receiving full data for (${text('receivingNotBrands')}) and asked them to update their permissions on their Management system so full data can be submitted for (${text('receivingNotBrands')}).`);
  if (checked('chkAggregateText') && text('aggregateTextBrands')) parts.push(`I noted there are a number of repairs on (${text('aggregateTextBrands')}) where we are not receiving full data and this may be due to a difference in spelling of the "MAKE" on their permissions vs the Job Card and requested they ensure full data is submitted for all repairs on (${text('aggregateTextBrands')}).`);
  const flaggedForms = disclaimerBrands(NOT_SUBMITTED);
  if (flaggedForms.length) parts.push(`I reminded them to submit the relevant Disclaimer forms for (${flaggedForms.join(', ')}). I referred them to & attached the relevant (${flaggedForms.join(', ')}) bulletins & corresponding Disclaimer forms.`);
  if (d.openLong) parts.push(`I noted there are a number of repairs which have been active for an unusually long time (${d.openLong}), and reminded them to close off/cancel Job cards as soon as possible after the repairs have been completed/cancelled.`);
  const { low } = lowYears(d);
  if (low.length) parts.push(`I queried the low number of completed repairs for (${low.join(', ')}).`);
  if (d.writeOffs === 0) parts.push('I queried lack of write-offs.');

  // Notes + creator
  const notes = text('additionalNotes'), creator = radio('creator');
  if (notes) parts.push(`Additional Notes: ${notes}${creator ? ` (${creator})` : ''}`);
  else if (creator) parts.push(`(${creator})`);

  $('reportText').innerHTML = `<p>${parts.join(' ')}</p>`;
}

/* =====================================================================
   7. GENERATE EMAIL
   ===================================================================== */
function selectedOEMs() {
  return APPROVALS.filter(([id]) => checked('ap-' + id)).map(([id, label, emailName]) => {
    if (id === 'mg') return radio('mgType') === 'EV' ? 'MG EV' : 'MG';
    if (id === 'stellantis') return STELLANTIS_BRANDS[radio('stellantisType')] || 'Stellantis';
    return emailName || label;
  });
}

function stellantisParagraph() {
  const type = radio('stellantisType');
  const qualityControl = type !== 'Standard';      // Premium (and unselected) include Quality Control docs
  const qualityCheckSheet = type === 'Premium';
  return 'Please also remember to complete and upload the Accident Damage Vehicle Categorization Sheet' +
    `${qualityControl ? ', Quality Control Documentation' : ''} and supporting documents for all repairs on Stellantis vehicles and the Disclaimer form for any repairs on in-warranty Stellantis vehicles where non-genuine, second hand, alternate salvaged and/or grey parts are fitted. ` +
    'Please find attached the relevant bulletin regarding how to complete and upload the required documents via AutoMX (https://www.automx.co.za/automx-main/) as well as the ' +
    `${qualityCheckSheet ? 'Quality Check Sheet and ' : ''}Disclaimer Form.`;
}

// Same method as the mini report: past years vs. their average, 2026 vs. a pro-rata expectation
function lowYears(d) {
  const years = { 2022: d.completed2022, 2023: d.completed2023, 2024: d.completed2024, 2025: d.completed2025, 2026: d.completed2026 };
  const past = [2022, 2023, 2024, 2025];
  const pastAvg = past.reduce((sum, y) => sum + years[y], 0) / past.length;
  const expected2026 = (pastAvg / 12) * (new Date().getMonth() + 1);
  const low = past.filter(y => years[y] > 0 && years[y] < pastAvg * 0.9);
  if (years[2026] > 0 && years[2026] < expected2026 * 0.9) low.push(2026);
  const [peakYear, peakCount] = Object.entries(years).reduce((m, c) => c[1] > m[1] ? c : m, [0, 0]);
  return { low, peakYear, peakCount };
}

function generateEmail() {
  const d = numbers(), { completedTotal, repairTotal, allTotal } = totals(d);
  const system = managementSystemText();
  const lastSubmitted = checked('chkLastSubmitted') && $('lastSubmittedDate').value ? fmtDate($('lastSubmittedDate').value) : '';
  const hasAccess = checked('chkHasAccess');
  const ppJobDetails = text('pp2026JobsInput');
  const aggregateBrands = checked('chkAggregateText') ? text('aggregateTextBrands') : '';
  const notFullBrands = checked('chkNotReceiving') ? text('receivingNotBrands') : '';
  const oems = selectedOEMs();
  const p = [];     // paragraphs; entries starting with "<" are rendered as raw HTML blocks

  p.push('Good day,', 'I hope this e-mail finds you well.',
    'Kindly note, at present, your validation has failed. Kindly note this will be considered as a non-compliance at time of audit.');

  if (lastSubmitted) {
    p.push(`Kindly note data was last submitted to AutoMX Connect on ${lastSubmitted}. Kindly note data must be submitted daily. ` +
      (managementSystems().length ? 'Please follow the attached instructions to ensure daily submission of data. ' : '') +
      `If you have any issues, we suggest you contact ${system} directly.`);
  }

  if (notFullBrands) p.push(`Kindly note we see you are not submitting full data for ${notFullBrands}. Please urgently update your permissions on your management system (by following the attached instructions) so full data can be submitted for ${notFullBrands}. If you need any assistance updating your permissions please contact ${system} for assistance.`);

  if (aggregateBrands) {
    p.push(`Kindly note we see that you are not submitting full data for all repairs on ${aggregateBrands} vehicles. Kindly note this may be due to a difference in spelling of the Make on the relevant Job Card and your permissions on ${system}. For example if your permissions are set to send full data for "${aggregateBrands}" but the make on a Job Card is captured as "EOM" your management system will read these as two different Makes and not send full data for said job card. Please ensure that full data is submitted for all repairs on ${aggregateBrands} vehicles from date of approval (date). Please find attached copies of your Active Repairs, 2025 Completed Repairs and 2026 Completed Reports where I have highlighted the relevant repairs in yellow.`);
  }

  if (checked('chkAggregateMake') && radio('aggregateMakeOption') === 'Excluding') {
    p.push('Kindly note you do not need to rectify the red "No\'s" under the "Has Make" Column unless the Job Card is a repair on an approved brand.');
  }

  p.push('Please find attached herewith updated AutoMX Connect validation reports for your company. Please correct all fields indicated in red on your management system (the changes will be sent to us on your next file upload).');

  // Guide to logging in — only when something is materially flagged
  const highPercentage =
    [d.validModel, d.hasRegno, d.missingVIN, d.missRegUnknownWarranty, d.mileage, d.ownerName, d.ownerTel, d.fullQuote]
      .some(v => over5(v, repairTotal)) ||
    over5(d.partDescription, completedTotal) || over5(d.missingSupplier, completedTotal) || over5(d.ppp, allTotal);
  if (!hasAccess && (highPercentage || ppJobDetails)) {
    p.push('Kindly note you can find your most up-to-date validation report by logging into AutoMX Connect (https://www.automxconnect.com/Automatrix/) and following the instructions set out in the attached Guide.');
  }

  if (checked('chkFullData')) {
    p.push('Kindly note that we see that you are submitting full data for a number of OEMs which you either do not hold approval with or which are not administered by AutoMX. Kindly note that when assessing your validation report we only consider the following fields for such brands: Job Start Date, Job Completion Date (if applicable) and Part Purchase Price as this forms part of the aggregate data required to be submitted to AutoMX Connect. That being said we highly recommend that you rectify all the data flagged in the validation report, regardless of brand, as this will make the reporting available to you on AutoMX Connect much more accurate and of use to you. We wish to remind you that only you have access to the data regarding brands with which you do not hold approval or which are not administered by AutoMX.');
  }

  if (hasAccess) {
    p.push('Please let us know the name/s, surname/s and e-mail address/es of the person/s we can grant access to AutoMX Connect. Having access to AutoMX Connect will allow you to draw the validation report (as well as other reports based on your data submissions) at your own convenience.');
  }

  // Invalid-model wording
  const models = selectedModels();
  modelNotes(models).forEach(t => p.push(t));

  // Parts information
  if (oems.length && ppJobDetails) {
    const list = joinList(oems, 'and');
    p.push(`Kindly note further that your data submissions to AutoMX Connect indicate that Parts have only been fitted to ${d.pp2025} vehicles repaired in 2025 & ${d.pp2026} vehicles repaired in 2026 and the Total Spent on Parts submitted for Body Shop has been submitted as ${fmtMoney(d.tsp2025)} for 2025 and ${fmtMoney(d.tsp2026)} for 2026. There also appear to be a number of repairs on approved brands where only Part Description, Part Number and Job Card Price are being submitted.`,
      'Kindly note that the validation report checks if Part Order and Part Purchase Price are captured to let it know parts were fitted to a vehicle and so to check if Part Description, Supplier Name etc. are being submitted.',
      'Please be sure to submit the following required parts information to AutoMX Connect:',
      `<ol style="padding-left:20px;line-height:2">
         <li>Part Description (for each and every part fitted to ${list} vehicles)</li>
         <li>Supplier Name (for each and every part fitted to ${list} vehicles)</li>
         <li>Part Purchase Price if purchased from the relevant OEM or one of its dealers (for each and every part fitted to ${list} vehicles)</li>
         <li>Total spent on Parts (not broken down by model)</li></ol>`);
  }

  // Disclaimer forms — driven by the dropdown status
  if (checked('ap-stellantis') && NOT_SUBMITTED.includes(disclaimerStatus('stellantis'))) p.push(stellantisParagraph());

  const outOfWarranty = OUT_OF_WARRANTY_BRANDS.filter(b => disclaimerBrands(NOT_SUBMITTED).includes(b));
  if (outOfWarranty.length) {
    const list = joinList(outOfWarranty);
    p.push(`Please also remember to submit the relevant disclaimer form for any out of warranty ${list} vehicles where non-genuine, second hand, alternate salvaged and/or grey safety critical parts are fitted. Please find attached the relevant ${list} Bulletin/s and corresponding Disclaimer form/s.`);
  }

  if (NOT_SUBMITTED.includes(disclaimerStatus('volvov'))) p.push('Please remember to submit the Volvo Warranty & Maintenance Verification form for all repairs on Volvo Trucks.');

  const inWarranty = disclaimerBrands(NOT_SUBMITTED, { includeSpecial: false });
  if (inWarranty.length) {
    const list = joinList(inWarranty, 'or');
    p.push(`Please also remember to submit the relevant disclaimer form for any in warranty ${list} vehicles where non-genuine, second hand, alternate salvaged and/or grey parts are fitted. Please find attached the relevant ${list} Bulletin/s and corresponding Disclaimer form/s.`);
  }

  // Long-open repairs (Extended Delayed report only if there are extended delays)
  if (d.openLong > 0) {
    p.push('We further wish to bring to your attention that there are a number of repairs which have been active for an unusually long time. Please ensure that job cards are closed as soon as possible after completion and input relevant completion date so that AutoMX Connect can recognise that the repair has been completed. When closed, the job will automatically move from Active to completed, and count as a job for the month in which it is closed. Alternatively if the repairs have been cancelled please cancel the Job Card on your management system so AutoMX Connect knows to remove the repair from your reporting. ' +
      `Please find attached a copy of your Active Repairs${d.extndDelay > 0 ? ' and Extended Delayed Repairs' : ''} Report which shows which repairs have been submitted to AutoMX Connect as active. Kindly note you can view the most up-to-date version of this report by logging into AutoMX Connect and following the instructions in the attached Guide.`);
  }

  // Unusually low completed totals
  const { low, peakYear, peakCount } = lowYears(d);
  if (low.length) {
    const years = joinList(low);
    p.push(`Kindly note further that the number of completed repairs for ${years} appear unusually low given that ${text('autobodyName') || 'your panel shop'} repaired ${peakCount} vehicles in ${peakYear}. Please check the below totals and let us know if they are an accurate reflection of the total number of vehicles repaired at your panel shop or not. If they are not accurate we suggest you contact ${system} for assistance in ensuring that data for all vehicles repaired in ${years} are submitted to AutoMX Connect.`);
  }

  // Totals table
  const status = lastSubmitted ? 'NOT DAILY' : 'ACTIVE';
  const tableRows = [
    ['Active Repairs', d.activeRepairs], ['2022 Completed Repairs', d.completed2022], ['2023 Completed Repairs', d.completed2023],
    ['2024 Completed Repairs', d.completed2024], ['2025 Completed Repairs', d.completed2025], ['2026 Completed Repairs', d.completed2026],
    ['Write-offs', d.writeOffs],
  ].map(([label, v]) => `<tr><td style="padding:8px 16px;border:1px solid #ddd">${label}</td><td style="padding:8px 16px;border:1px solid #ddd;text-align:center">${v}</td></tr>`).join('');
  const th = (align, label) => `<th style="background:#6a1a7f;color:#fff;padding:10px 16px;text-align:${align};border:1px solid #5a1a6f">${label}</th>`;
  p.push('Kindly note that below figures should match the total number of vehicles repaired at your panel shop;',
    `<table style="border-collapse:collapse;font-size:14px;min-width:400px">
       <tr>${th('left', 'Category')}${th('center', 'Total number of vehicles')}</tr>${tableRows}
       <tr><td style="padding:8px 16px;border:1px solid #ddd">Submission Status</td>
           <td style="padding:8px 16px;border:1px solid #ddd;text-align:center;font-weight:bold;color:${lastSubmitted ? '#c0392b' : '#27ae60'}">${status}</td></tr></table>`);

  if (d.writeOffs === 0) p.push('We notice your profile does not include any write-offs. Please be reminded that in terms of the SLA with all OEMs we administer, this information must be provided.');
  if (d.writeOffsUnder40k > 0) p.push('We also just wanted to check whether all the vehicles submitted to AutoMX Connect as write-offs were actually written-off. Please check the attached write-offs report and let us know. Kindly note if any of them were not write-offs please be sure to properly close or cancel the relevant repair on your management system instead of writing it off. Kindly note you can view the most up-to-date version of this report by logging into AutoMX Connect and following the attached instructions.');
  p.push('Please note that we are aware that certain information cannot be added to jobs retrospectively (such as mileage for vehicles handed back to clients). We only request that you ensure that all future jobs include all such information as to ensure compliance in future.');

  $('reportText').innerHTML = p.map(s => s.startsWith('<') ? `<div class="block">${s}</div>` : `<p>${s}</p>`).join('');
}

/* =====================================================================
   8. START-UP
   ===================================================================== */
document.addEventListener('DOMContentLoaded', () => {
  applyTheme(localStorage.getItem('theme') || 'light');
  buildForm();
  loadFormData();
  syncSubToggles();
  $('autosaveIndicator').textContent = IDLE_MSG;

  // One delegated listener handles auto-save and the small interactive rules
  ['input', 'change'].forEach(evt => document.addEventListener(evt, e => {
    if (evt === 'change') {
      if (e.target.name === 'creator' && e.target.checked)
        document.querySelectorAll('input[name="creator"]').forEach(c => { if (c !== e.target) c.checked = false; });
      if (SUB_TOGGLES.some(t => t.trigger === e.target.id)) syncSubToggles();
    }
    autoSave();
  }));
});
</script>
